# No job has a time limit: a slow runner makes a step slow, not wrong. Each step that runs a
# command that installs, downloads or tests runs under .github/scripts/stall-watch.sh, which stops
# it only when, for 20 minutes, it has printed no line and the runner has received under 4 MiB,
# prints a hang record when it does, and reports the step's duration as a notice. The script is a
# copy of bilbospocketses/streamflex's (PR #64, 64defdd), where the rule and its measurements are
# written up. Steps that use an action (the two checkouts) are GitHub's own and are not wrapped.

name: e2e

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The American-spelling gate below diffs from the merge-base with the
          # base branch and refuses a shallow clone.
          fetch-depth: 0

      # American spelling. The cross-repo gate from bilbospocketses/american-spelling
      # scans the lines this branch adds and its commit messages, and fails on a
      # British spelling. It runs first because it is the cheapest gate here.
      #
      # Steps inside e2e rather than a job of their own: master's ruleset
      # requires a check named exactly `e2e`, so a separate job would not be
      # required and could rot unnoticed.
      #
      # Exceptions are not kept in this repo. A verbatim quote takes the inline
      # `spelling: allow` marker; an identifier used on many lines goes in the
      # gate's central allow.txt, and reaches this repo when the pin is bumped.
      # On a push to master the base is master itself, so there is nothing to scan.
      - name: Fetch the base branch
        run: bash .github/scripts/stall-watch.sh --name "git fetch" -- git fetch --no-tags origin "+refs/heads/${BASE}:refs/remotes/origin/${BASE}"
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
      - name: Check out the American-spelling gate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bilbospocketses/american-spelling
          ref: 21ed7e5524c511d9ee584778d42b72e6ddaeba86 # v1.0.2
          path: .american-spelling
          persist-credentials: false
      - name: Check American spelling
        # The runner's own Python 3; the gate is stdlib-only.
        run: >-
          bash .github/scripts/stall-watch.sh --name "American spelling" --
          python3 .american-spelling/check-american-spelling.py
          --repo .
          --base "origin/${BASE}"
          --repo-slug "${SLUG}"
        env:
          BASE: ${{ github.base_ref || github.event.repository.default_branch }}
          SLUG: ${{ github.repository }}
      - name: Remove the gate checkout
        # Keeps it out of the working tree the npm install and tests run in.
        run: rm -rf .american-spelling

      - name: Install dependencies
        run: bash .github/scripts/stall-watch.sh --name "npm ci" -- npm ci
      - name: Install Playwright's chromium
        run: bash .github/scripts/stall-watch.sh --name "playwright install" -- npx playwright install --with-deps chromium
      - name: E2e tests
        run: bash .github/scripts/stall-watch.sh --name "e2e tests" -- npm run test:e2e
